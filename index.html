.graph-workspace{display:flex;flex:1;gap:0;min-height:clamp(180px,30dvh,320px);min-width:0}
.graph-workspace #canvas{container-type:inline-size;min-width:0;min-height:0}
.source-panel{display:flex;flex-direction:column;overflow:hidden;flex:var(--source-share,43) 1 0;min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff}
.source-bar{display:flex;align-items:center;justify-content:space-between;background:#f6f8f1;border-bottom:1px solid var(--line);padding:6px 10px 6px 14px;flex:none}
.source-bar h2{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;margin:0}
.source-bar h2 svg{width:16px;height:16px}
.source-close{width:30px;height:30px;border:0;background:transparent;color:#596652}
.source-close:hover{background:#e7ebdf}
.source-close svg{width:16px;height:16px}
.source-heading{padding:12px 14px;flex:none;border-bottom:1px solid #dde3d6}
.source-heading h3{margin:0 0 4px;font:600 16px var(--mono);overflow-wrap:anywhere}
.source-body{flex:1;min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;background:#fafbf7;tab-size:2}
.source-body .source-line{padding:0 14px 0 6px;gap:12px}
.source-body .line-num{flex:none}
.source-body>.outline,.source-body>.metadata,.source-body>div:not(.source-code){margin:5px 12px 12px}
@container (max-width:330px){.legend{bottom:50px}.legend em{font-size:10px}}
@media(max-width:900px){
  main:has(.source-open){min-height:800px}
  .graph-workspace.source-open{flex-direction:column;gap:0}
  .source-open #canvas{min-height:0}
  .source-panel{min-height:0;width:100%;max-width:none}
  .source-heading{padding:8px 12px}
}

.source-open #canvas{flex:var(--graph-share,57) 1 0}
#paneSplitter,#inspectorSplitter{display:none;flex:0 0 16px;align-items:center;justify-content:center;cursor:col-resize;touch-action:none;user-select:none;border-radius:4px}
.source-open #paneSplitter,#inspectorSplitter{display:flex}
#paneSplitter::before,#inspectorSplitter::before{content:"";width:4px;height:34px;border-radius:4px;background:#aab4a3}
[role=separator]:hover::before,[role=separator]:focus-visible::before,.resizing>[role=separator]::before{background:#547542}
[role=separator]:focus-visible{outline:2px solid #608344;outline-offset:-3px}
.resizing{user-select:none}
#inspectorTabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 7px}
.inspector-tab{flex:none;border:none;border-radius:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--dim);font-size:13px}
.inspector-tab[aria-selected="true"]{border-color:#668744;color:#304d25;font-weight:650}
#details{max-height:clamp(110px,23vh,240px);overflow:auto}
.variable-list{padding:10px 15px 13px;font-size:13px}
.variable-function{font:600 14px var(--mono);margin:0 0 6px}
.no-variables{margin:3px 0;color:var(--dim)}
.variable-list table{border-collapse:collapse;width:100%;text-align:left}
.variable-list th,.variable-list td{padding:5px 10px 5px 0;border-bottom:1px solid #e3e8dd;vertical-align:top;overflow-wrap:anywhere}
.variable-list th{font-size:12px;color:var(--dim)}
.variable-list code{font:13px var(--mono)}
.variable-list td:last-child{font:12px var(--mono);color:var(--dim)}
@media(max-width:900px){
  #paneSplitter{cursor:row-resize}
  #paneSplitter::before{width:34px;height:4px}
  .source-open .source-panel{min-height:0}
}
@media(max-width:720px){
  .inspector-tab{padding:8px 7px;font-size:12px}
  .variable-list{padding:8px}
}

#inspectorWorkspace{flex:1;min-height:0;display:flex;flex-direction:column}
#inspectorWorkspace>.graph-workspace{flex:var(--upper-share,72) 1 0;min-height:0}
#inspectorSplitter{cursor:row-resize}
#inspectorSplitter::before{width:42px;height:4px}
#inspectorPanel{flex:var(--inspector-share,28) 1 0;display:flex;flex-direction:column;min-height:96px;margin:0}
#inspectorPanel .inspector-title,#inspectorTabs{flex:none}
#details{flex:1;min-height:0;max-height:none}
.declaration-link{display:inline;text-align:left;padding:2px 0;border:0;border-radius:2px;background:none;color:#355a30;text-decoration:underline;text-decoration-color:#98b18c;text-underline-offset:3px;overflow-wrap:anywhere}
.variable-list tbody tr{cursor:pointer}
.variable-list tbody tr:hover,.variable-list tbody tr:focus-within{background:#f0f5e9}
.declaration-line{background:#e9f3da;box-shadow:inset 3px 0 #688447}
.declaration-name{background:#d1e9a6;color:#263d20;border-radius:2px;font-weight:700;outline:none}
@media(max-width:900px){
  #inspectorWorkspace>.graph-workspace.source-open{min-height:270px}
  .source-open #canvas{min-height:85px}
  .source-open .source-panel{min-height:155px}
  .source-heading{max-height:35%;overflow:auto}
}

.panel-button{border:0;background:transparent;border-radius:4px;padding:5px;color:var(--ink);font:inherit}
.panel-button:hover{background:#e7ecdf}
.side-heading .panel-button{margin:-5px;color:var(--dim);min-width:32px;min-height:32px}
.explorer-tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
.explorer-tab{flex:1;gap:7px;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 4px;background:transparent;font-size:14px;color:var(--dim)}
.explorer-tab[aria-selected=true]{border-color:#668744;color:#304d25;font-weight:650}
#explorerPanel{display:flex;flex-direction:column;min-height:0}
#explorerPanel .search{margin:12px 0}
#globalList{max-height:55vh;overflow:auto;padding-bottom:12px}
.global-entry{border-bottom:1px solid #e2e6dc;border-radius:0;overflow-wrap:anywhere;padding:7px 6px}
.global-entry small{margin-top:3px}
.global-more{width:100%;margin:6px 0}
#toggleInspector{margin:-3px 0 -3px -5px;font-size:13px;font-weight:650}

@media(min-width:721px){
  .workspace.explorer-hidden{grid-template-columns:minmax(0,1fr)}
  .workspace.explorer-hidden #sidebar{display:none}

<body>
<header class="topbar">
  <a class="wordmark" href="#" aria-label="C Atlas home"><span class="brand-icon" data-icon="brand"></span>C Atlas</a>
  <span class="top-sep"></span><span class="app-name">Code explorer</span>
  <div class="top-actions"><button class="plain help-link" id="help"><i data-icon="book"></i><span>Quick guide</span></button><button class="dark" id="upload"><i data-icon="upload"></i>Open ZIP</button></div>
</header>
<div id="workspace" class="workspace">
  <aside id="sidebar" aria-label="Project explorer">
    <div class="side-heading"><span>Project explorer</span><button id="hideExplorer" class="panel-button" aria-label="Hide Project explorer" aria-controls="sidebar" aria-expanded="true" title="Hide Project explorer"><i data-icon="panel"></i></button></div>
    <div class="project-card"><div class="project-mark"><i data-icon="cube"></i></div><div class="project-info"><strong id="projectName"></strong><small id="projectMeta"></small></div></div>
    <div class="explorer-tabs" role="tablist" aria-label="Project explorer views"><button id="explore-files" class="explorer-tab" role="tab" aria-controls="explorerPanel" aria-selected="true">Files <span class="counter" aria-hidden="true" id="fileCount"></span></button><button id="explore-globals" class="explorer-tab" role="tab" aria-controls="explorerPanel" aria-selected="false" tabindex="-1">Globals <span class="counter" aria-hidden="true" id="globalCount"></span></button></div>
    <div id="explorerPanel" role="tabpanel" aria-labelledby="explore-files">
    <label class="search"><i data-icon="search"></i><input id="search" type="search" placeholder="Find file or function" aria-label="Find a file or function"><kbd>/</kbd></label>
    <nav id="tree" aria-label="Project files"></nav>
    <nav id="globalList" aria-label="Project globals" hidden></nav>
    </div>
    <button class="drop-zone" id="dropButton"><span class="drop-icon"><i data-icon="upload"></i></span><b>Open a project</b><small>Drop a ZIP or browse files</small></button>

<script id="analysis-code">/* Lightweight C source index. C text is tokenized, never executed. */
const AtlasAnalysis = (() => {
  const decoder = new TextDecoder();
  const controls = new Set("if else for while switch case return sizeof _Alignof alignof typeof __typeof__ _Generic _Static_assert static_assert _Alignas __attribute__ __attribute __declspec asm __asm__ do break continue goto".split(" "));
  const decorations = new Set(["__attribute__", "__attribute", "__declspec", "_Alignas", "alignas", "asm", "__asm__"]);
  const identifier = /^[A-Za-z_]\w*$/;
  function normalize(path) {
    const parts = [];
    for (const part of path.replace(/\\/g, "/").split("/")) {
      if (part === "..") parts.pop();
      else if (part && part !== ".") parts.push(part);
    }
    return parts.join("/");
  }

  function tokenize(source,onDirective){
    const starts = [0];
    for (let offset = 0; offset < source.length; offset++) if (source[offset] === "\n") starts.push(offset + 1);
    function lineOf(offset) {
      let lower = 0, upper = starts.length;
      while (lower < upper) {
        const middle = (upper + lower) >>> 1;
        if (starts[middle] <= offset) lower = middle + 1; else upper = middle;
      }
      return lower;
    }
    // Mask literals and comments first, retaining quoted include directives for indexing.
    const pattern = /\/\*[\s\S]*?(?:\*\/|$)|\/\/[^\n]*(?:\\\n[^\n]*)*|^[\t ]*#[^\n]*(?:\n(?<=\\\n)[^\n]*)*|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|[A-Za-z_]\w*|(?:0[xX][\da-fA-F]+|\d+(?:\.\d*)?)\w*|->|[^\s]/gm;
    const tokens = [];
    for (const match of source.matchAll(pattern)) {
      const value = match[0];
      if (value.startsWith("//") || value.startsWith("/*")) continue;
      if (value.trimStart()[0] === "#") {
        if(onDirective)onDirective(value.trimStart(),lineOf(match.index));
        continue;
      }
      tokens.push({value, at:match.index});
    }
    const pairs = new Map(), brackets = [];
    for (let index = 0; index < tokens.length; index++) {
      const value = tokens[index].value;
      if (value === "(" || value === "{" || value === "[") brackets.push(index);
      else if (value === ")" || value === "}" || value === "]") {

        if (left !== undefined && tokens[left].value === (value === ")" ? "(" : value === "]" ? "[" : "{")) {
          brackets.pop(); pairs.set(left,index); pairs.set(index,left);
        }
      }
    }
    const token = index => tokens[index]?.value;
    function until(index,end,stops){
      while(index<end && !stops.has(token(index))){
        const close=pairs.get(index);
        index=close>index ? close+1 : index+1;
      }
      return Math.min(index,end);
    }
    return {source,tokens,token,pairs,lineOf,until};
  }

  const builtinTypes=new Set("void char short int long float double signed unsigned _Bool bool _Complex _Imaginary __int128 __int128_t __uint128_t".split(" "));
  const modifiers=new Set("auto register static extern typedef inline const volatile restrict _Atomic _Thread_local thread_local constexpr __restrict __restrict__ __const __volatile__".split(" "));
  const tags=new Set(["struct","union","enum"]);
  function readDeclaration(reader,start,end,types,assumeType=false){
    const {token,pairs,source,tokens}=reader;
    if(start>=end)return null;
    const text=(first,last)=>source.slice(tokens[first].at,tokens[last-1].at+token(last-1).length).trim();
    function skipAttributes(index,limit){
      while(index<limit){
        if(decorations.has(token(index)) && token(index+1)==="(" && pairs.has(index+1))index=pairs.get(index+1)+1;
        else if(token(index)==="[" && token(index+1)==="[" && pairs.has(index))index=pairs.get(index)+1;
        else break;
      }
      return index;
    }
    let index=start,typed=false,isTypedef=false,isExtern=false,isStatic=false;
    while(index<end){
      const word=token(index);
      const afterAttribute=skipAttributes(index,end);
      if(afterAttribute!==index){index=afterAttribute;continue;}
      if((word==="_Atomic"||word==="typeof"||word==="__typeof__") && token(index+1)==="(" && pairs.has(index+1)){
        index=pairs.get(index+1)+1;typed=true;continue;
      }
      if(modifiers.has(word)){isTypedef ||= word==="typedef";isExtern ||= word==="extern";isStatic ||= word==="static";index++;continue;}
      if(builtinTypes.has(word)){typed=true;index++;continue;}
      if(tags.has(word)){
        typed=true;index=skipAttributes(index+1,end);
        if(identifier.test(token(index)||""))index++;
        index=skipAttributes(index,end);
        if(token(index)==="{" && pairs.has(index))index=pairs.get(index)+1;
        continue;
      }
      if(!typed && identifier.test(word) && !controls.has(word) &&
        (types.has(word)||word.endsWith("_t")||assumeType||identifier.test(token(index+1)||""))){typed=true;index++;continue;}

    }
    if(!typed)return null;
    const firstDeclarator=index,specifier=text(start,index),entries=[];
    function declarator(begin,limit){
      let cursor=begin,indirect=false;
      while(token(cursor)==="*"){
        indirect=true;cursor++;
        while(modifiers.has(token(cursor)))cursor++;

      let nameIndex,firstOperator="";
      if(token(cursor)==="(" && pairs.has(cursor) && pairs.get(cursor)<limit){
        const group=declarator(cursor+1,pairs.get(cursor));if(!group)return null;

      }else if(cursor<limit && identifier.test(token(cursor)) && !controls.has(token(cursor))){nameIndex=cursor++;}
      else return null;
      while(cursor<limit){
        const after=skipAttributes(cursor,limit);
        if(after!==cursor){cursor=after;continue;}
        if(!["[","("].includes(token(cursor)) || !pairs.has(cursor) || pairs.get(cursor)>=limit)return null;

      const begin=index;

      const parsed=declarator(begin,declEnd);
      if(!parsed)return null;
      const next=reader.until(declEnd,end,new Set([","]));

  }

  // Inspect a selected function on demand. Names bind from their declarator to the end of their block or loop.
  function inspectVariables(fn,files){
    const file=files.get(fn.path);
    const types=new Set(),globals=new Map(),visited=new Set();

    const close=pairs.get(body),hidden=new Set(),bindings=new Map(),usedGlobals=new Set();
    function hide(first,end){for(let i=first;i<end;i++)hidden.add(i);}
    function register(entry,scope,scopeEnd){
      const index=entry.nameIndex;
      const variable={name:entry.name,declaration:entry.declaration,path:file.path,offset:fn.first+tokens[index].at,line:fn.firstLine+lineOf(tokens[index].at)-1,scope};

    for(let index=params+1;index<pairs.get(params);){
      const end=until(index,pairs.get(params),new Set([","]));
      const declaration=readDeclaration(reader,index,end,types,true);
      for(const entry of declaration?.entries||[])register(entry,"Parameter",close);
      index=end+1;
    }
    function declarationStatement(start,end,scope,scopeEnd,visibleTypes){
      const declaration=readDeclaration(reader,start,end,visibleTypes);
      if(!declaration)return;
      hide(start,declaration.firstDeclarator);
      for(const entry of declaration.entries){
        hidden.add(entry.nameIndex);
        if(declaration.isTypedef){visibleTypes.add(entry.name);hide(entry.begin,entry.declEnd);continue;}
        if(entry.firstOperator==="("){hide(entry.begin,entry.declEnd);continue;}
        // Parameter names in a function-pointer prototype are separate from names used in the enclosing body.
        for(let i=entry.nameIndex+1;i<entry.declEnd;i++)if(token(i)==="(" && pairs.has(i)){hide(i,pairs.get(i)+1);i=pairs.get(i);}
        register(entry,declaration.isExtern?"Block extern":scope,scopeEnd);
      }
    }
    function statementEnd(index,limit){
      const word=token(index);
      if(word==="{" && pairs.has(index))return pairs.get(index)+1;
      if(["for","if","switch","while"].includes(word) && pairs.has(index+1)){
        let end=statementEnd(pairs.get(index+1)+1,limit);
        if(word==="if" && token(end)==="else")end=statementEnd(end+1,limit);
        return end;
      }
      if(word==="do"){
        const end=statementEnd(index+1,limit);
        if(token(end)==="while" && pairs.has(end+1))return Math.min(limit,pairs.get(end+1)+2);
        return end;
      }
      return Math.min(limit,until(index,limit,new Set([";"]))+1);
    }
    function walk(start,end,scope,visibleTypes){
      for(let index=start;index<end;){
        const word=token(index);
        if(word==="{" && pairs.has(index)){
          const finish=pairs.get(index);
          walk(index+1,finish,"Nested block",new Set(visibleTypes));index=finish+1;continue;
        }
        if(word==="for" && pairs.has(index+1)){
          const finish=pairs.get(index+1),firstSemi=until(index+2,finish,new Set([";"]));
          declarationStatement(index+2,firstSemi,"Loop",statementEnd(finish+1,end),new Set(visibleTypes));
          index=finish+1;continue;
        }
        if(["if","switch","while"].includes(word) && pairs.has(index+1)){index=pairs.get(index+1)+1;continue;}
        if(word==="else"||word==="do"||word===";"){index++;continue;}
        if(word==="case"||word==="default"){index=Math.min(end,until(index+1,end,new Set([":"]))+1);continue;}
        if(identifier.test(word) && token(index+1)===":"){hidden.add(index);index+=2;continue;}
        const finish=until(index,end,new Set([";"]));
        declarationStatement(index,finish,scope,end,visibleTypes);index=finish+1;
      }
    }
    walk(body+1,close,"Function body",new Set(types));
    for(let index=body+1;index<close;index++){
      const name=token(index);
      if(!globals.has(name)||usedGlobals.has(name)||hidden.has(index))continue;
      if([".","->","goto","struct","union","enum"].includes(token(index-1)))continue;
      if(bindings.get(name)?.some(([first,last])=>first<=index && index<last))continue;
      usedGlobals.add(name);
      result.other.push({...globals.get(name),scope:"File scope"});
    }
    return result;
  }

  function parseFile(path, original) {
    const source = original.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
    const includes=[],macros=[],functions=[],globals=[],typedefs=[],types=new Set();

        if (include) includes.push({name:include[2], quoted:include[1] === '"', line});
        const macro = /^#\s*define\s+(\w+)\(/.exec(directive);
        if (macro) macros.push(macro[1]);

    let start = 0;
    for (let index = 0; index < tokens.length; index++) {
      if (token(index) === ";") {
        const declaration=readDeclaration(reader,start,index,types,true);
        for(const entry of declaration?.entries||[]){

          }

      if (close === undefined) continue;

        if (token(cursor) !== "(") continue;
        const end = pairs.get(cursor);
        if (end === undefined || end >= index) break;
        if (identifier.test(token(cursor - 1) || "") && !controls.has(token(cursor - 1)) && !decorations.has(token(cursor - 1))) {

        }

      }

          const called = token(cursor);
          if (!identifier.test(called) || token(cursor+1) !== "(" || controls.has(called)) continue;
          if (token(cursor-1) === "." || token(cursor-1) === "->") continue;
          rawCalls.push({name:called,line:lineOf(tokens[cursor].at)});
        }
        functions.push({name, path, id:path+"#"+tokens[nameAt].at, line:lineOf(tokens[nameAt].at), firstLine:lineOf(first),
          lastLine:lineOf(last-1), first, last, parametersOffset:tokens[nameAt+1].at, bodyOffset:tokens[index].at, signature:source.slice(first,tokens[index].at).trim().replace(/\s+/g," "),
          internal:tokens.slice(start,nameAt).some(item=>item.value==="static"),rawCalls});
        start = close + 1;
      }
      index = close;
    }
    return {path, source, lineCount:lineOf(source.length), includes, macros, functions, globals, typedefs};
  }

  function projectGlobals(files){
    const variables=[];
    const external=new Map();
    const priority={declaration:0,tentative:1,initialized:2};
    for(const file of files){
      const byName=new Map(),internalNames=new Set();
      for(const variable of file.globals){
        if(variable.internal)internalNames.add(variable.name);
        const previous=byName.get(variable.name);
        if(!previous || priority[variable.kind]>priority[previous.kind])byName.set(variable.name,variable);
      }
      for(const variable of byName.values()){
        if(internalNames.has(variable.name)){variables.push(variable);continue;}
        if(!external.has(variable.name))external.set(variable.name,[]);
        external.get(variable.name).push(variable);
      }
    }
    for(const candidates of external.values()){
      const initialized=candidates.filter(variable=>variable.kind==="initialized");
      const definitions=initialized.length?initialized:candidates.filter(variable=>variable.kind==="tentative");
      if(definitions.length){
        for(const variable of definitions)variables.push(variable);
      }else{
        variables.push(candidates.find(variable=>/\.h$/i.test(variable.path))||candidates[0]);
      }
    }
    return variables.sort((a,b)=>a.name.localeCompare(b.name)||a.path.localeCompare(b.path)||a.offset-b.offset);
  }

  function analyze(entries, name) {
    const files = entries.map(entry => parseFile(entry.path, entry.source)).sort((a,b)=>a.path.localeCompare(b.path));
    const paths = new Set(files.map(file=>file.path)), suffixes = new Map();

        const suffix = parts.slice(index).join("/");

        include.target = include.quoted && paths.has(relative) ? relative : paths.has(include.name) ? include.name : suffixes.get(include.name) || null;
      }

        reachable.add(path);
        const current = fileMap.get(path);
        for (const macro of current.macros) macros.add(macro);
        for (const include of current.includes) if(include.target) pending.push(include.target);

        const calls = new Map(), unresolved = new Set();
        for (const call of fn.rawCalls) {

          const matches = definitions.get(call.name) || [];
          let candidates = matches.filter(other => other.path === file.path);
          if (!candidates.length) candidates = matches.filter(other => other.internal && reachable.has(other.path));
          if (!candidates.length) candidates = matches.filter(other => !other.internal);
          if (candidates.length === 1) calls.set(candidates[0].id, call.line);
          else unresolved.add(call.name);
        }
        fn.calls = [...calls.keys()]; fn.unresolved = [...unresolved]; delete fn.rawCalls;

  }

function markSelection(){

  for(const edge of byId("edges").querySelectorAll("[data-from]")){const active=edge.dataset.from===state.selected || edge.dataset.to===state.selected;edge.setAttribute("stroke",active?"#647c50":"#9ca793");edge.setAttribute("marker-end",active?"url(#arrow-active)":"url(#arrow-normal)");}
}
function transform(){byId("stage").style.transform='translate('+state.x+'px,'+state.y+'px) scale('+state.scale+')';byId("zoomLabel").textContent=Math.round(state.scale*100)+"%";}
function fitGraph(initial=false){
  if(!state.layout)return;
  const box=byId("canvas"),{width,height}=state.layout;
  const fit=Math.min((box.clientWidth-46)/Math.max(width,1),(box.clientHeight-84)/Math.max(1,height),1.15);
  state.scale=Math.max(.045,initial && box.clientWidth<530?Math.max(.75,fit):fit);
  state.x=(box.clientWidth-width*state.scale)/2;state.y=(box.clientHeight-32-height*state.scale)/2;
  if(initial && box.clientWidth<530)centerSelected();else transform();
}
function centerSelected(){
  const p=state.layout?.positions.get(state.selected);if(!p)return;
  const box=byId("canvas");
  const left=state.x+p.x*state.scale,top=state.y+p.y*state.scale;
  if(left<12||top<12||left+p.width*state.scale>box.clientWidth-12||top+nodeHeight*state.scale>box.clientHeight-44){
    state.x=box.clientWidth/2-(p.x+p.width/2)*state.scale;state.y=(box.clientHeight-30)/2-(p.y+nodeHeight/2)*state.scale;
  }transform();
}
function zoom(factor,point){
  const box=byId("canvas"),x=point?.x??box.clientWidth/2,y=point?.y??box.clientHeight/2;
  const previous=state.scale;state.scale=Math.max(.045,Math.min(3.5,previous*factor));
  state.x=x-(x-state.x)*state.scale/previous;state.y=y-(y-state.y)*state.scale/previous;transform();
}
function relationGroup(label,ids,mode=state.mode){
  const section=el("div"),items=el("div","chips");section.append(el("div","section-label insp",label+" · "+ids.length),items);
  for(const id of ids){const entry=state.views[mode].byKey.get(id);if(!entry)continue;const chip=button("chip",entry.title,()=>select(id,mode,true));chip.title=entry.path;items.append(chip);}
  if(!ids.length)items.append(el("span","no-rel","None"));return section;
}
const variableCache=new WeakMap();
const inspectorViews=["overview","locals","arguments","other"];
const inspectorLabels={overview:"Overview",locals:"Function locals",arguments:"Arguments",other:"Other variables"};
let inspectorView="overview";

function inspectTab(name){
  inspectorView=name;
  renderDetails();
}
function renderVariableList(fn){
  let variables=variableCache.get(fn);
  if(!variables){
    variables=AtlasAnalysis.inspectVariables(fn,state.files);
    variableCache.set(fn,variables);
  }
  const rows=variables[inspectorView];
  const list=el("div","variable-list");
  list.append(el("h3","variable-function",fn.name+"()"));
  if(!rows.length){
    const message={locals:"No variables declared directly in this function body.",arguments:"No named arguments.",other:"No nested variables or referenced file-scope variables found."};
    list.append(el("p","no-variables",message[inspectorView]));
    return list;
  }
  const table=el("table"),head=table.createTHead().insertRow(),body=table.createTBody();
  const labels=["Declaration",...(inspectorView==="other"?["Scope"]:[]),"Location"];
  for(const label of labels){const heading=el("th","",label);heading.scope="col";head.append(heading);}
  for(const variable of rows){
    const row=body.insertRow(),declaration=row.insertCell();
    const jump=()=>openSourcePanel(variable);
    const link=button("declaration-link","",jump);
    link.title="Go to "+variable.name+" at "+variable.path+":"+variable.line;
    link.setAttribute("aria-label",link.title);
    link.append(el("code","",variable.declaration));declaration.append(link);
    row.addEventListener("click",event=>{if(!event.target.closest("button"))jump();});
    if(inspectorView==="other")row.insertCell().textContent=variable.scope;
    row.insertCell().textContent=variable.path+":"+variable.line;
  }
  list.append(table);
  return list;
}
function buildInspectorTabs(){
  const list=byId("inspectorTabs");
  for(const [index,name] of inspectorViews.entries()){
    const tab=button("inspector-tab",inspectorLabels[name],()=>inspectTab(name));
    tab.id="inspect-"+name;
    tab.setAttribute("role","tab");
    tab.setAttribute("aria-controls","details");
    tab.addEventListener("keydown",event=>{
      const next={ArrowLeft:(index+3)%4,ArrowRight:(index+1)%4,Home:0,End:3}[event.key];
      if(next===undefined||state.mode!=="call")return;
      event.preventDefault();
      inspectTab(inspectorViews[next]);
      list.children[next].focus();
    });
    list.append(tab);
  }
}

function renderDetails(){
  const active=state.mode==="call"?inspectorView:"overview";
  const panel=byId("details");
  for(const [index,tab] of Array.from(byId("inspectorTabs").children).entries()){
    const name=inspectorViews[index],selected=name===active;
    tab.setAttribute("aria-selected",String(selected));
    tab.disabled=state.mode!=="call" && name!=="overview";
    tab.tabIndex=selected?0:-1;
  }
  panel.setAttribute("aria-labelledby","inspect-"+active);
  if(active!=="overview"){
    panel.replaceChildren(renderVariableList(state.functions.get(state.selected)));
    panel.scrollTop=0;
    return;
  }
  const view=currentView(),item=view.byKey.get(state.selected),isCall=state.mode==="call";
  const grid=el("div","detail-grid"),name=el("div");
  name.append(el("h2","selection-title",item.title));
  const fn=isCall?state.functions.get(item.id):null;
  name.append(el("div","metadata",item.path+(isCall?":"+fn.line:"")));
  if(isCall && item.entry)name.append(el("span","entry-tag","Program entry point"));
  grid.append(name,relationGroup(isCall?"CALLED BY":"INCLUDED BY",view.incoming.get(item.id)),relationGroup(isCall?"CALLS":"INCLUDES",item.next));
  byId("details").replaceChildren(grid);
  byId("stats").textContent=state.project.files.length+" files · "+state.functions.size+" functions · "+state.views.call.count+" call edges";
}
function refresh(){
  state.focused=state.focused || currentView().items.length>180;
  byId("callTab").setAttribute("aria-pressed",String(state.mode==="call"));byId("includeTab").setAttribute("aria-pressed",String(state.mode==="include"));
  byId("focusButton").setAttribute("aria-pressed",String(state.focused));
  byId("entryLegend").textContent=state.mode==="call"?"Entry point":"C source";byId("funcLegend").textContent=state.mode==="call"?"Function":"Header";byId("edgeLegend").textContent=state.mode==="call"?"Calls":"Includes";
  renderTree();renderDetails();renderGraph();fitGraph(true);
}
function showDialog(content){
  byId("dialogContent").replaceChildren(content);
  if(!byId("dialog").open)byId("dialog").showModal();
}
function highlight(line){
  const fragment=document.createDocumentFragment(),pattern=/(\/\/.*$|\/\*.*?(?:\*\/|$)|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:static|inline|typedef|struct|const|return|for|int|bool|void|char|while|if|else|unsigned|true|false|include|define|float|double|enum|break|switch|case)\b)/g;
  let end=0;for(const match of line.matchAll(pattern)){
    fragment.append(line.slice(end,match.index),el("span",match[0][0]==="/"?"code-comment":/["']/.test(match[0][0])?"code-string":"code-key",match[0]));
    end=match.index+match[0].length;
  }fragment.append(line.slice(end));return fragment;
}
let displayedDeclaration=null;
function openSourcePanel(variable=null){
  const panel=byId("sourcePanel");
  if(!panel.hidden && !variable && !displayedDeclaration)return;
  panel.hidden=false;
  byId("graphWorkspace").classList.add("source-open");
  byId("showSource").setAttribute("aria-expanded","true");
  renderSource(variable);
}
function closeSourcePanel(){
  displayedDeclaration=null;
  byId("sourcePanel").hidden=true;
  byId("graphWorkspace").classList.remove("source-open");
  byId("showSource").setAttribute("aria-expanded","false");
  byId("sourceBody").replaceChildren();
}
function dismissSource(){
  closeSourcePanel();
  const selectedNode=byId("nodes").querySelector('[aria-pressed="true"]');
  (selectedNode || byId(inspectorOpen?"showSource":"toggleInspector")).focus({preventScroll:true});
}
function renderSource(variable=null){
  displayedDeclaration=variable;
  const item=currentView().byKey.get(state.selected);
  const file=state.files.get(variable?variable.path:item.path);
  const selectedFunction=state.mode==="call"?state.functions.get(item.id):null;
  const withinFunction=selectedFunction && (!variable || (file.path===selectedFunction.path &&
    variable.offset>=selectedFunction.first && variable.offset<selectedFunction.last));
  const fn=withinFunction?selectedFunction:null;
  const source=fn?file.source.slice(fn.first,fn.last):file.source;
  const lines=source.split("\n"),firstLine=fn?fn.firstLine:1;
  const body=byId("sourceBody");
  byId("sourceKind").textContent=fn?"Function source":"File source";
  byId("sourceName").textContent=fn?fn.name+"()":base(file.path);
  const location=variable?"line "+variable.line:lines.length===1?"line "+firstLine:"lines "+firstLine+"–"+(firstLine+lines.length-1);
  byId("sourceLocation").textContent=file.path+" · "+location;
  const code=el("div","source-code");
  const pageSize=400,targetLine=variable?variable.line-firstLine:-1;
  let first=Math.max(0,targetLine-Math.floor(pageSize/2)),next=first,marker=null;
  function makeLines(begin,end){
    const batch=document.createDocumentFragment();
    for(let index=begin;index<end;index++){
      const line=lines[index],row=el("div","source-line"),text=el("span");
      if(index===targetLine){
        const lineStart=Math.max(fn?fn.first:0,file.source.lastIndexOf("\n",variable.offset-1)+1);
        const column=variable.offset-lineStart;
        marker=el("mark","declaration-name",line.slice(column,column+variable.name.length));
        marker.tabIndex=-1;
        row.classList.add("declaration-line");
        text.append(highlight(line.slice(0,column)),marker,highlight(line.slice(column+variable.name.length)));
      }else text.append(highlight(line));
      row.append(el("span","line-num",firstLine+index),text);batch.append(row);
    }
    return batch;
  }
  const earlier=button("outline","Show earlier lines",()=>{
    const begin=Math.max(0,first-pageSize),oldHeight=body.scrollHeight,oldScroll=body.scrollTop;
    code.prepend(makeLines(begin,first));first=begin;earlier.hidden=first===0;
    body.scrollTop=oldScroll+body.scrollHeight-oldHeight;
  });
  function more(){
    const end=Math.min(next+pageSize,lines.length);
    code.append(makeLines(next,end));next=end;loadMore.hidden=next===lines.length;
  }
  const loadMore=button("outline","Show more lines",more);
  earlier.hidden=first===0;
  more();body.replaceChildren(earlier,code,loadMore);
  if(fn?.unresolved.length)body.append(el("p","metadata","Unresolved call-like names: "+fn.unresolved.join(", ")));
  if(!fn && file.functions.length)body.append(relationGroup("FUNCTIONS IN THIS FILE",file.functions.map(f=>f.id),"call"));
  body.scrollTop=0;body.scrollLeft=0;
  if(marker){
    marker.focus({preventScroll:true});
    const bounds=body.getBoundingClientRect(),target=marker.getBoundingClientRect();
    body.scrollTop+=target.top-bounds.top-(bounds.height-target.height)/2;
    marker.scrollIntoView({block:"nearest",inline:"nearest"});
  }
}
function guide(){
  const box=el("div");box.innerHTML='<h2>Quick guide</h2><p>Open a ZIP containing your C sources and headers. Your browser reads the archive on this device.</p><h3>Follow the arrows</h3><p>In the call graph, an arrow runs from a caller to the function it calls. In Includes, it runs from a file to the project header it includes. Click a block to read its source. Drag the divider between the graph and source to resize them. Drag the divider above the Inspector to change its height. You can also focus a divider and use the arrow keys. Click a variable in the Inspector to jump to its highlighted declaration. In the Project explorer, choose Globals to find file-scope variables by name or file. Select one to open its definition. A declaration-only entry opens the available declaration. The Inspector shows function-body locals, named arguments, and other variables. Other variables include nested and loop declarations, block externs, and referenced variables declared at file scope in the source or its included headers. Macro-generated declarations and build-dependent code may be incomplete.</p><h3>Explore the map</h3><p>Drag the canvas to pan. Scroll or use + and − to zoom. Use Fit graph to see the map, or Focus to isolate a block and its neighbors. On a keyboard, use Tab and Enter to select blocks, and the arrow keys to pan the canvas.</p><h3>What gets indexed?</h3><p>The source index recognizes common C function definitions and direct calls with a unique project definition. Macros, build-time conditions, function pointers, and complex declarators can produce missing or approximate relationships. System headers and unresolved external calls have no project block.</p><p>Projects over 45 blocks open in Focus. Above 180 blocks, use search or the file tree to explore one neighborhood at a time.</p>';
  if(!state.demo){const actions=el("div","dialog-actions");actions.append(button("outline","Open sample project",()=>{byId("dialog").close();loadProject(AtlasAnalysis.analyze(sampleFiles,"voxel-engine"),true);}));box.append(actions);}
  showDialog(box);
}
function importFile(file){
  if(!file)return;
  if(!/\.zip$/i.test(file.name)){notify("Choose a .zip archive containing .c or .h files.");return;}
  if(file.size>256*1024*1024){notify("The ZIP must be 256 MiB or smaller.");return;}
  if(importWorker)importWorker.terminate();
  const workerCode=byId("analysis-code").textContent+'\nself.onmessage=async ({data})=>{try{const entries=await AtlasAnalysis.readZip(await data.file.arrayBuffer()); self.postMessage({project:AtlasAnalysis.analyze(entries,data.name)});}catch(error){self.postMessage({error:error.message});}};';
  const url=URL.createObjectURL(new Blob([workerCode],{type:"text/javascript"}));
  const worker=new Worker(url);URL.revokeObjectURL(url);importWorker=worker;
  byId("status").textContent="Indexing "+file.name+"…";hideSidebar();
  function finish(error){worker.terminate();if(importWorker!==worker)return false;importWorker=null;if(error){notify(error);byId("status").textContent="Import failed";}return true;}
  worker.onmessage=({data})=>{if(finish(data.error)&&data.project)loadProject(data.project);};
  worker.onerror=()=>finish("The project could not be indexed in this browser.");
  worker.postMessage({file,name:file.name.replace(/\.zip$/i,"")});
}
for(const id of ["upload","dropButton"])byId(id).onclick=()=>byId("fileInput").click();
byId("fileInput").onchange=event=>{importFile(event.target.files[0]);event.target.value="";};
let dragDepth=0;
window.addEventListener("dragenter",event=>{if(event.dataTransfer.types.includes("Files")){event.preventDefault();dragDepth++;document.body.classList.add("dragging");}});
window.addEventListener("dragover",event=>{if(event.dataTransfer.types.includes("Files"))event.preventDefault();});
window.addEventListener("dragleave",()=>{if(--dragDepth<=0){dragDepth=0;document.body.classList.remove("dragging");}});
window.addEventListener("drop",event=>{event.preventDefault();dragDepth=0;document.body.classList.remove("dragging");importFile(event.dataTransfer.files[0]);});
// Both dividers resize their first pane. The graph/source divider changes direction on narrow screens.
function connectSplitter(splitter,container,firstPane,secondPane,options){
  const sizes={vertical:options.vertical,horizontal:options.horizontal};
  const orientation=()=>options.stacked && !options.stacked.matches?"vertical":"horizontal";
  let drag=null;
  function setSize(value){
    const direction=orientation(),size=Math.max(options.min,Math.min(options.max,Math.round(value)));
    sizes[direction]=size;
    container.style.setProperty("--"+firstPane+"-share",size);
    container.style.setProperty("--"+secondPane+"-share",100-size);
    splitter.setAttribute("aria-orientation",direction);
    splitter.setAttribute("aria-valuenow",size);
    splitter.setAttribute("aria-valuetext",options.firstLabel+" "+size+"%, "+options.secondLabel+" "+(100-size)+"%");
  }
  options.stacked?.addEventListener("change",()=>setSize(sizes[orientation()]));
  setSize(sizes[orientation()]);
  splitter.addEventListener("pointerdown",event=>{
    if(event.button!==0 || drag)return;
    event.preventDefault();splitter.focus({preventScroll:true});
    const direction=orientation(),horizontal=direction==="horizontal";
    const available=horizontal?container.clientHeight-splitter.offsetHeight:container.clientWidth-splitter.offsetWidth;
    if(available<=0)return;
    drag={id:event.pointerId,direction,available,origin:horizontal?event.clientY:event.clientX,size:sizes[direction]};
    splitter.setPointerCapture(event.pointerId);container.classList.add("resizing");
  });
  splitter.addEventListener("pointermove",event=>{
    if(!drag || event.pointerId!==drag.id || drag.direction!==orientation())return;
    const position=drag.direction==="horizontal"?event.clientY:event.clientX;
    setSize(drag.size+100*(position-drag.origin)/drag.available);
  });
  splitter.addEventListener("lostpointercapture",()=>{drag=null;container.classList.remove("resizing");});
  splitter.addEventListener("keydown",event=>{
    const direction=orientation(),size=sizes[direction];
    const moves=direction==="horizontal"?{ArrowUp:size-2,ArrowDown:size+2}:{ArrowLeft:size-2,ArrowRight:size+2};
    const value={...moves,Home:options.min,End:options.max}[event.key];
    if(value===undefined)return;
    event.preventDefault();setSize(value);
  });
}
connectSplitter(byId("paneSplitter"),byId("graphWorkspace"),"graph","source",{
  stacked:window.matchMedia("(max-width:900px)"),vertical:57,horizontal:55,min:25,max:75,firstLabel:"Graph",secondLabel:"Source"
});
connectSplitter(byId("inspectorSplitter"),byId("inspectorWorkspace"),"upper","inspector",{
  horizontal:72,min:35,max:80,firstLabel:"Workspace",secondLabel:"Inspector"
});

buildInspectorTabs();
for(const name of ["files","globals"]){
  const tab=byId("explore-"+name);
  tab.onclick=()=>setExplorerView(name);

}
byId("search").oninput=()=>explorerView==="files"?renderTree():renderGlobals();

byId("closeSource").onclick=dismissSource;byId("help").onclick=guide;
byId("dialog").addEventListener("click",event=>{if(event.target===byId("dialog"))byId("dialog").close();else if(event.target.closest(".chip"))byId("dialog").close();});
byId("toggleInspector").onclick=toggleInspector;
byId("hideExplorer").onclick=()=>{setExplorerOpen(false);byId("toggleSidebar").focus();};
byId("toggleSidebar").onclick=()=>{
  const opening=!(narrowExplorer.matches?mobileExplorerOpen:desktopExplorerOpen);
  setExplorerOpen(opening);
  if(opening)byId("explore-"+explorerView).focus();
};
narrowExplorer.addEventListener("change",()=>{mobileExplorerOpen=false;updateExplorerVisibility();});
updateExplorerVisibility();
document.addEventListener("click",event=>{if(!event.target.closest("#sidebar,#toggleSidebar"))hideSidebar();});
document.querySelector(".wordmark").onclick=event=>{event.preventDefault();const view=currentView();select(view.items.find(i=>i.entry)?.id||view.items[0].id);fitGraph(true);};
const canvas=byId("canvas");let drag=null;
canvas.addEventListener("wheel",event=>{if(event.target.closest(".graph-controls,.legend"))return;event.preventDefault();const bounds=canvas.getBoundingClientRect();zoom(Math.exp(-Math.sign(event.deltaY)*.14),{x:event.clientX-bounds.left,y:event.clientY-bounds.top});},{passive:false});
canvas.addEventListener("pointerdown",event=>{if(event.button!==0||event.target.closest("button,.legend,.graph-controls"))return;drag={x:event.clientX-state.x,y:event.clientY-state.y,id:event.pointerId};canvas.setPointerCapture(event.pointerId);});
canvas.addEventListener("pointermove",event=>{if(drag?.id!==event.pointerId)return;state.x=event.clientX-drag.x;state.y=event.clientY-drag.y;transform();});
canvas.addEventListener("lostpointercapture",()=>{drag=null;});
canvas.addEventListener("keydown",event=>{
  if(event.target!==canvas)return;
  const shifts={ArrowUp:[0,40],ArrowDown:[0,-40],ArrowLeft:[40,0],ArrowRight:[-40,0]};
  if(shifts[event.key]){event.preventDefault();state.x+=shifts[event.key][0];state.y+=shifts[event.key][1];transform();}
  if(event.key==="+"||event.key==="=")zoom(1.25);if(event.key==="-")zoom(.8);if(event.key==="0")fitGraph();
});
document.addEventListener("keydown",event=>{if(event.key==="/"&&!event.ctrlKey&&!event.metaKey&&!byId("dialog").open && event.target!==byId("search")){event.preventDefault();setExplorerOpen(true);byId("search").focus();}if(event.key==="Escape"){
  if(mobileExplorerOpen){hideSidebar();byId("toggleSidebar").focus();}
  else if(!byId("dialog").open && !byId("sourcePanel").hidden)dismissSource();
}});
new ResizeObserver(()=>{if(state.layout)fitGraph(true);}).observe(canvas);
loadProject(AtlasAnalysis.analyze(sampleFiles,"voxel-engine"),true);
